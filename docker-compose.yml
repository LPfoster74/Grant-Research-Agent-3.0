version: '3.8'
services:
  app:
    build: .
    container_name: grant-agent-app
    environment:
      - TRUST_AUTH_PROXY=1
      - AUTH_PROXY_HEADER=X-Remote-User
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - grantnet

  proxy:
    image: nginx:stable-alpine
    container_name: grant-agent-proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - grantnet

networks:
  grantnet:
    driver: bridge
