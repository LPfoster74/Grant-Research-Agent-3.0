server {
  listen 80;
  server_name _;

  location / {
    # NOTE: configure your auth (Kerberos/NTLM/OIDC) here in production.
    # The example below assumes the proxy will set $remote_user after authenticating.
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Remote-User $remote_user;
  }
}
